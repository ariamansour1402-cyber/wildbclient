name: Build client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Download Forge MDK 1.8.9
        run: |
          curl -fL -o mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/1.8.9-11.15.1.2318-1.8.9/forge-1.8.9-11.15.1.2318-1.8.9-mdk.zip"
          mkdir mdk
          unzip -q mdk.zip -d mdk

      - name: Add our code to the MDK
        run: |
          rm -rf mdk/src/main/java/com/example
          cp -r src/main/java/com mdk/src/main/java/
          sed -i 's#http://files.minecraftforge.net/maven#https://maven.minecraftforge.net#' mdk/build.gradle
          sed -i 's/^group.*/group = "com.customclient"/' mdk/build.gradle
          sed -i 's/^archivesBaseName.*/archivesBaseName = "CustomPvPClient"/' mdk/build.gradle

      - name: Build
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew setupCIWorkspace build --no-daemon

      - name: Package jar + installer
        run: |
          mkdir dist
          cp mdk/build/libs/CustomPvPClient-*.jar dist/
          cp installer/Install.bat installer/install.ps1 dist/

      - uses: actions/upload-artifact@v4
        with:
          name: CustomPvPClient
          path: dist
